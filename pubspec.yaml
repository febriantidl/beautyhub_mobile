name: beautyhub_mobile
description: BeautyHub Mobile App — Flutter client untuk Laravel API
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client untuk call API Laravel
  http: ^1.2.0

  # Simpan token login (SharedPreferences)
  shared_preferences: ^2.2.2

  # Pilih gambar dari galeri/kamera (untuk Search by Image)
  image_picker: ^1.0.7

  # Icon material
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  # Kalau nanti ada assets (gambar lokal, font), tambah di sini
  # assets:
  #   - assets/images/